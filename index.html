<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Tin nhắn</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#fff;color:#161616}.app{max-width:520px;margin:auto;min-height:100dvh}.head{display:flex;gap:12px;align-items:center;padding:24px 18px 12px}.avatar{width:45px;height:45px;background:linear-gradient(135deg,#d7e9ff,#8bc1ff);border-radius:50%;display:grid;place-items:center;font-size:24px}.head h1{font-size:27px;margin:0;font-weight:800}.search{background:#f0f2f5;color:#73777e;border-radius:24px;margin:12px 16px 18px;padding:12px 16px}.chat{display:flex;align-items:center;gap:13px;padding:12px 17px;cursor:pointer}.chat:active{background:#f2f4f7}.person{width:57px;height:57px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:27px;background:#e8d9ff}.chat:nth-of-type(2) .person{background:#ffe6bf}.chat:nth-of-type(3) .person{background:#c9f4ea}.detail{min-width:0;flex:1}.detail strong{font-size:16px}.detail p{font-size:14px;color:#747983;margin:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:12px;color:#9196a0}.footer{position:fixed;bottom:0;left:0;width:100%;display:flex;justify-content:center;gap:80px;background:white;border-top:1px solid #eee;padding:12px 0 max(14px,env(safe-area-inset-bottom));color:#1685ff;font-weight:650}.footer span+span{color:#777}.reveal{position:fixed;inset:0;display:none;z-index:10;background:linear-gradient(145deg,#2179fa,#7445f9);color:white;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}.reveal.show{display:flex;animation:pop .35s ease}.emoji{font-size:76px;animation:bounce .8s infinite alternate}.reveal h2{font-size:clamp(30px,8vw,49px);line-height:1.2;max-width:650px;text-shadow:0 5px 15px #0003}.reveal p{font-size:18px;opacity:.9}.reveal button{border:0;background:white;color:#285ddd;border-radius:999px;font-size:17px;font-weight:bold;padding:15px 25px;margin-top:30px}@keyframes bounce{to{transform:rotate(12deg) scale(1.12)}}@keyframes pop{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}</style></head><body><main class="app"><div class="head"><div class="avatar">🙂</div><h1>Đoạn chat</h1></div><div class="search">⌕ &nbsp; Tìm kiếm</div><div class="chat" tabindex="0" role="button"><div class="person">💜</div><div class="detail"><strong>Người bí mật</strong><p>Em có chuyện này muốn nói với anh...</p></div><span class="time">21:30</span></div><div class="chat" tabindex="0" role="button"><div class="person">😎</div><div class="detail"><strong>Hội bạn thân</strong><p>Chuyện này đừng kể với ai nhé 🤫</p></div><span class="time">20:15</span></div><div class="chat" tabindex="0" role="button"><div class="person">🌸</div><div class="detail"><strong>Người lạ</strong><p>Đã gửi một ảnh</p></div><span class="time">Hôm qua</span></div></main><div class="footer"><span>◉ Chat</span><span>♧ Danh bạ</span></div><section class="reveal" id="reveal"><div class="emoji">👀</div><h2>BỎ CÁI THÓI ĐỌC TRỘM TIN NHẮN ĐI!</h2><p>Bị bắt quả tang rồi nhé! 😏</p><button id="back">Quay lại</button></section><script>const reveal=document.getElementById('reveal');document.querySelectorAll('.chat').forEach(el=>{const f=()=>{reveal.classList.add('show');if(navigator.vibrate)navigator.vibrate([120,70,120])};el.addEventListener('click',f);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}})});document.getElementById('back').onclick=()=>reveal.classList.remove('show');if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
